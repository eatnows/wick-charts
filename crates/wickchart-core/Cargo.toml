[package]
name = "wickchart-core"
version = "0.1.0"
edition = "2021"
description = "WASM compute core for wick-charts — domain-to-pixel coordinate scaling, compiled to run at native speed in the browser."
license = "MIT"
repository = "https://github.com/eatnows/wick-charts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
